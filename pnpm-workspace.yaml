minimumReleaseAge: 1440
# These exact versions are intentional in the lockfile and have passed project checks.
# Keep the release-age delay for every other version and dependency.
minimumReleaseAgeExclude:
  - '@heroui/react@3.2.6'
  - '@heroui/styles@3.2.6'
  - 'prettier@3.9.8'

allowBuilds:
  '@heroui-pro/react': true
  '@zowe/secrets-for-zowe-sdk': true
  esbuild: true
  heroui-native-pro: true
  heroui-pro: true
