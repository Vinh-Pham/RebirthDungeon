packages:
  - client
  - server
  - packages/*

# Expo SDK 57 supports isolated dependencies; keep each app's React version separate.
nodeLinker: isolated

allowBuilds:
  "@shopify/react-native-skia": true
  "@zowe/secrets-for-zowe-sdk": true
  heroui-native-pro: true
  unrs-resolver: true
  esbuild: true
  workerd: true

minimumReleaseAge: 0

patchedDependencies:
  heroui-native@1.0.10: patches/heroui-native@1.0.10.patch
