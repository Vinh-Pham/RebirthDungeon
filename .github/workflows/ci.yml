name: CI

on:
  push:
    branches: [main, libgdx]
  pull_request:

jobs:
  shared-tests-desktop-android:
    name: Shared tests, desktop compile, Android packaging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Installs cmdline-tools and accepts licenses so AGP can fetch the
      # compileSdk platform and build-tools it needs on first use.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Keep dependency verification strict in CI. New checksums must be reviewed
      # and committed to gradle/verification-metadata.xml before this build runs.
      - name: Build and verify
        run: >
          ./gradlew --dependency-verification strict
          :core:check :core:compileJava :lwjgl3:compileJava
          :android:checkDebugDuplicateClasses :android:assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # iOS is verified on a macOS host with Xcode and the RoboVM toolchain, not in
  # CI; see README ("iOS verification") for the manual steps. A successful JVM
  # compile of :ios is not an iOS build and is intentionally not reported here.
