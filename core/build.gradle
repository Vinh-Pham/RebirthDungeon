[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.ashley:ashley:$ashleyVersion"
  api "com.badlogicgames.gdx-controllers:gdx-controllers-core:$gdxControllersVersion"
  api "com.badlogicgames.gdx:gdx-ai:$aiVersion"
  api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.bladecoder.ink:blade-ink:$bladeInkVersion"
  api "com.crashinvaders.lml:gdx-kiwi:$lmlVersion"
  api "com.esotericsoftware.spine:spine-libgdx:$spineRuntimeVersion"
  api "com.github.libgdx:box2dlights:$box2dlightsVersion"
  api "com.github.tommyettinger.tantrum:tantrum-digital:$tantrumDigitalVersion"
  api "com.github.tommyettinger.tantrum:tantrum-jdkgdxds:$tantrumJdkgdxdsVersion"
  api "com.github.tommyettinger.tantrum:tantrum-regexodus:$tantrumRegExodusVersion"
  api "com.github.tommyettinger:anim8-gdx:$anim8Version"
  api "com.github.tommyettinger:crux:$cruxVersion"
  api "com.github.tommyettinger:digital:$digitalVersion"
  api "com.github.tommyettinger:funderby:$funderbyVersion"
  api "com.github.tommyettinger:gand:$gandVersion"
  api "com.github.tommyettinger:gdcrux:$gdcruxVersion"
  api "com.github.tommyettinger:jdkgdxds:$jdkgdxdsVersion"
  api "com.github.tommyettinger:jdkgdxds_interop:$jdkgdxdsInteropVersion"
  api "com.github.tommyettinger:juniper:$juniperVersion"
  api "com.github.tommyettinger:libgdx-utils:$utilsVersion"
  api "com.github.tommyettinger:regexodus:$regExodusVersion"
  api "com.github.tommyettinger:sjInGameConsole:$inGameConsoleVersion"
  api "com.github.tommyettinger:typing-label:$typingLabelVersion"
  api "com.github.yellowstonegames.squidsquad:squidcore:$squidSquadVersion"
  api "com.github.yellowstonegames.squidsquad:squidgrid:$squidSquadVersion"
  api "com.github.yellowstonegames.squidsquad:squidpath:$squidSquadVersion"
  api "com.github.yellowstonegames.squidsquad:squidplace:$squidSquadVersion"
  api "com.github.yellowstonegames.squidsquad:squidpress:$squidSquadVersion"
  api "com.github.yellowstonegames.squidsquad:squidseek:$squidSquadVersion"
  api "com.github.yellowstonegames.squidsquad:squidsmooth:$squidSquadVersion"
  api "com.github.yellowstonegames.squidsquad:squidstorecore:$squidSquadVersion"
  api "com.github.yellowstonegames.squidsquad:squidstoregrid:$squidSquadVersion"
  api "com.github.yellowstonegames.squidsquad:squidstorepath:$squidSquadVersion"
  api "com.github.yellowstonegames.squidsquad:squidstoretext:$squidSquadVersion"
  api "com.github.yellowstonegames.squidsquad:squidtext:$squidSquadVersion"
  api "com.github.yellowstonegames.squidsquad:squidwrathcore:$squidSquadVersion"
  api "com.github.yellowstonegames.squidsquad:squidwrathgrid:$squidSquadVersion"
  api "com.github.yellowstonegames.squidsquad:squidwrathpath:$squidSquadVersion"
  api "com.kotcrab.vis:vis-ui:$visUiVersion"
  api "com.squidpony:squidlib-extra:$squidlibExtraVersion"
  api "com.squidpony:squidlib-util:$squidlibUtilVersion"
  api "com.squidpony:squidlib:$squidlibVersion"
  api "org.apache.fory:fory-core:$foryVersion"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
