name: rebirth_dungeon
description: "Rebirth Dungeon — a 2D pixel-art dungeon crawler with dice-based combat and gacha mechanics."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

# First-prototype dependency set (see project-phases.md Phase 0 and
# dart-game-plan.md section 29). Add new packages deliberately, not all at once.
dependencies:
  flutter:
    sdk: flutter

  # Game rendering and presentation engines
  flame: ^1.38.2
  flame_audio: ^2.12.2
  rive: ^0.14.11

  # Application state, navigation
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  go_router: ^18.0.0

  # Persistence
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  shared_preferences: ^2.5.5

  # Immutable models and serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.16.0
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.8
  drift_dev: ^2.34.5

flutter:
  uses-material-design: true
